name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        npm cache clean --force
        npm install
    
    - name: Export web build
      run: npm run build:web
      env:
        NODE_ENV: production
    
    - name: Fix paths for GitHub Pages subpath
      run: |
        cd web-build
        # Add .nojekyll file
        touch .nojekyll
        # Fix paths in index.html
        sed -i 's|href="/|href="/CARDS_HOUSE-react-native-/|g' index.html
        sed -i 's|src="/|src="/CARDS_HOUSE-react-native-/|g' index.html
        # Fix paths in all JavaScript files (they contain hardcoded asset paths)
        find _expo -type f -name "*.js" -exec sed -i 's|"/_expo/|"/CARDS_HOUSE-react-native-/_expo/|g' {} +
        find _expo -type f -name "*.js" -exec sed -i "s|'/_expo/|'/CARDS_HOUSE-react-native-/_expo/|g" {} +
        # Fix paths for assets
        find _expo -type f -name "*.js" -exec sed -i 's|"/assets/|"/CARDS_HOUSE-react-native-/assets/|g' {} +
        find _expo -type f -name "*.js" -exec sed -i "s|'/assets/|'/CARDS_HOUSE-react-native-/assets/|g" {} +
        # Display the updated index.html for verification
        echo "Updated index.html:"
        cat index.html
    
    - name: Setup Pages
      uses: actions/configure-pages@v4
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './web-build'
  
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
